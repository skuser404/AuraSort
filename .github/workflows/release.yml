name: Release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Test before releasing
        run: python -m unittest discover -s tests -t .
      - name: Build ZIP + SHA256SUMS
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=aurasort/ -o "dist/aurasort-${TAG}.zip" "${TAG}"
          cp scripts/install.ps1 scripts/install.sh dist/
          cd dist && sha256sum aurasort-*.zip install.ps1 install.sh > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "${TAG}" dist/* --title "AuraSort ${TAG}" --generate-notes --verify-tag
